name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked
      - name: Windows installer integration
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install.Tests.ps1
      - name: Windows installer progress and HTTP
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install-ui.Tests.ps1
      - name: Git Bash installer
        shell: bash
        run: |
          sh -n install.sh
          bash tests/install-sh.Tests.sh
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/vstretch.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: vstretch.exe
          path: target/release/vstretch.exe
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check

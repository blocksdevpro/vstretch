[package]
name = "vstretch"
version = "1.2.0"
edition = "2024"
description = "Windows TUI to toggle native ↔ stretch display resolutions for FPS games (Valorant, CS2)"
license = "MIT"
repository = "https://github.com/blocksdevpro/vstretch"
homepage = "https://github.com/blocksdevpro/vstretch"
readme = "README.md"
keywords = ["valorant", "cs2", "resolution", "stretch", "tui"]
categories = ["command-line-utilities"]
authors = ["blocksdevpro"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
toml = "1.1.4"

clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
self-replace = "1.5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Devices_Display",
] }

[package]
name = "vstretch"
version = "0.1.0"
edition = "2024"
description = "CLI to toggle native and stretch display resolutions (built for Valorant)"
license = "MIT"
repository = "https://github.com/blocksdevpro/vstretch"
homepage = "https://github.com/blocksdevpro/vstretch"
readme = "README.md"
keywords = ["valorant", "resolution", "display", "stretch", "cli"]
categories = ["command-line-utilities"]
authors = ["blocksdevpro"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Devices_Display",
] }
